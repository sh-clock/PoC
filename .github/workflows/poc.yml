name: poc-ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release (release assets are FREE, unlike artifacts)

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (make)
        run: make -C . all V=1

      - name: Convert sample scenes (GLBs are not committed)
        run: |
          # input/ tracks only the base rip files; regenerate the GLBs with
          # the converter at THIS commit so CI always exercises the
          # tools/ipd2gltf.py it ships.
          python3 tools/ipd2gltf.py --input input --output input \
              --rooms THRF9FD,HP0003
          test -s input/THRF9FD.glb
          test -s input/HP0003.glb

      - name: Smoke test — engine renders a PNG headlessly
        run: |
          # --shot t=0 renders one deterministic frame (320x224) to
          # shots/shot_00000.00.png with no window: proves the release
          # binary actually runs, not just links.
          # (--shot REQUIRES a value: "t=SECONDS[,file=NAME.png]" —
          # a bare --shot exits with "unknown arg".)
          ./fog_poc --glb input/THRF9FD.glb --camdat input/camdat.json \
                    --input input --shot t=0
          test -s shots/shot_00000.00.png
          file shots/shot_00000.00.png

      - name: Package one-click test zip (linux)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          bash tools/package_release.sh "$TAG" dist ./fog_poc
          # prove the zip is REALLY one-click: unzip, run --test, check PNG
          mkdir -p /tmp/ziptest && cd /tmp/ziptest
          unzip -q "$GITHUB_WORKSPACE/dist/sh1x-poc-$TAG-linux.zip"
          ./RUN_THR.sh --test
          ./RUN_HP0003.sh --test
          test -s shots/SELFTEST_THR.png
          test -s shots/SELFTEST_HP0003.png
          echo "one-click zip verified: both self-tests rendered"

      - name: Upload release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sh1x-poc-${{ github.ref_name }}-linux.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Zig (cross-compile, no mingw toolchain needed)
        run: |
          # Same command documented in Makefile.mingw option B.
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/zig-linux-x86_64-0.13.0:$PATH"
          zig version
          zig cc -target x86_64-windows-gnu -O2 -std=c99 \
            -o fog_poc.exe src/fog_poc.c -luser32 -lgdi32
          file fog_poc.exe

      - name: Package one-click test zip (windows)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          # "" skips the linux binary/zip; only the -win zip is produced.
          bash tools/package_release.sh "$TAG" dist NONE ./fog_poc.exe
          unzip -l "dist/sh1x-poc-$TAG-win.zip"

      - name: Upload release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/sh1x-poc-${{ github.ref_name }}-win.zip

      - name: Build source tarball (any ref)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git archive --format=tar.gz -o "sh-poc-source.tar.gz" HEAD
          # attach in the next step
          echo "TARBALL=sh-poc-source.tar.gz" >> "$GITHUB_ENV"

      - name: Attach source tarball
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.TARBALL }}
