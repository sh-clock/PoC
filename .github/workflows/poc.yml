name: poc-ci
on:
  push:
    branches: [main]    # v32.3 comment CORRECTION: the earlier claim that
                         # this was 'the corrupted glob ain]' was WRONG —
                         # base64-verified history shows the file on GitHub
                         # was always [main] (the 'ain]' rendering was a
                         # terminal display artifact that ate the '[m'
                         # sequence). Kept explicit, no functional change.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the bump job commits version.txt + pushes the version
                    # tag; the build jobs publish zips as RELEASE ASSETS
                    # (free, unlike workflow artifacts)

# v32.3 (audit B1): serialize same-ref pushes — two pushes inside ~2 min
# both bumped version.txt at their OWN pushed SHA and collided on the
# same vX.Y tag (the second's git push failed -> its build ran (if:
# always()) but released NOTHING). The queue re-checks out main after
# the first bump landed and bumps the NEXT minor. cancel-in-progress is
# FALSE on purpose: cancelling would eat releases.
concurrency:
  group: poc-ci-${{ github.ref }}
  cancel-in-progress: false

# ---- v32.2 (S19): one release per push to main --------------------------
# The user-facing bug this fixes: releases only happened on MANUAL tag
# pushes, so code versions that existed only in commit messages (v31, v32)
# never got built or released — the release list said v28.0 while the code
# said v32. Now EVERY push to main: the bump job bumps version.txt by ONE
# minor level (32.0 -> 32.1 -> 32.2 ...), commits [skip ci], tags vX.Y and
# pushes both; the build jobs (needs: bump, ref: main) build that exact
# tree and publish the Release under the fresh tag. Tag pushes (v31.0,
# v32.0 backfills, manual v*) keep the classic path. NOTE: a GITHUB_TOKEN
# push cannot re-trigger workflows (anti-recursion) — that is WHY the
# build runs in THIS run on main instead of on the tag event.
jobs:
  bump:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      did: ${{ steps.bump.outputs.did }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version.txt by one minor level (v53: race-proof)
        id: bump
        run: |
          set -e
          git config user.name  "sh1-release-bot"
          git config user.email "sh1-release-bot@users.noreply.github.com"
          # v53 repair (the v33.51 orphaned-tag lesson): a push landing
          # between this run's checkout and its `git push` made the loser's
          # main-push fail while its tag-push SUCCEEDED (independent refs) —
          # the orphaned tag then blocked every later bump at `git tag`.
          # Fix: (a) re-checkout fresh main each round, (b) skip versions
          # whose tag already exists, (c) push main+tag ATOMICALLY,
          # (d) retry on race for up to 5 rounds.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main --tags
            git checkout -q -B bumpwork origin/main
            CUR=$(tr -d '[:space:]' < version.txt)
            MAJ="${CUR%%.*}"; MIN="${CUR##*.}"
            NEW="$MAJ.$((MIN + 1))"
            while git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null 2>&1; do
              MIN=$((MIN + 1)); NEW="$MAJ.$MIN"
            done
            printf '%s\n' "$NEW" > version.txt
            git add version.txt
            git commit -m "bump version to $NEW [skip ci]"
            git tag "v$NEW"
            if git push --atomic origin bumpwork:main "v$NEW"; then
              echo "did=1"   >> "$GITHUB_OUTPUT"
              echo "version=$NEW" >> "$GITHUB_OUTPUT"
              echo "bumped $CUR -> $NEW (tag v$NEW, attempt $attempt)"
              exit 0
            fi
            echo "round $attempt: push lost a race — retrying on fresh main"
            git tag -d "v$NEW" >/dev/null 2>&1 || true
          done
          echo "FATAL: bump could not land in 5 rounds"; exit 1

  build-linux:
    needs: bump
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main carries the bump commit; tags build the tag; PRs build the PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || (startsWith(github.ref, 'refs/tags/') && github.ref) || github.ref }}

      - name: Resolve the release tag (bump or pushed tag)
        id: rel
        run: |
          if [ "${{ needs.bump.outputs.did }}" = "1" ]; then
            echo "tag=v${{ needs.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (make)
        run: |
          # V41 E-6: the repo used to track built binaries; with one checked
          # out, make could see it "up to date" against the freshly checked-
          # out sources (mtime race) and CI would silently test the STALE
          # committed build. rm -f guarantees a fresh build even if a binary
          # is ever re-tracked or restored by a cache.
          rm -f fog_poc fog_poc.exe
          make -C . all V=1

      - name: Convert sample scenes (GLBs are not committed)
        run: |
          # The converter needs numpy (TIM decode) + Pillow (PNG encode) for
          # texture embedding; the bare runner python3 has neither.
          python3 -m pip install --user -q numpy pillow
          # input/ tracks only the base rip files; regenerate the GLBs with
          # the converter at THIS commit so CI always exercises the
          # tools/ipd2gltf.py it ships.
          # NOTE: --output must NOT be the input dir — the converter always
          # excludes the output directory from texture scanning (writing
          # into input/ would drop every texture reference -> degraded GLB).
          # v28: SU0203 (nightmare-school FAN room) + SU0300 (corridor
          # reference) join the CI conversion set.
          python3 tools/ipd2gltf.py --input input --output glbs \
              --rooms THRF9FD,HP0003,SU0203,SU0300
          test -s glbs/THRF9FD.glb
          test -s glbs/HP0003.glb
          test -s glbs/SU0203.glb
          test -s glbs/SU0300.glb

      - name: Animation regression check — the fan actually ticks
        run: |
          # TWO deterministic stills one ENGINE TICK apart (1/30 s) with a
          # FIXED camera: with the camera frozen, any pixel change can only
          # come from the animated prop (the SU0203 FAN_HIDE spinRng driver,
          # verbatim map1_s02.c:1564-1591). Guards the whole chain: ripper
          # propAnims emission -> engine parse -> tick -> draw.
          ./fog_poc --glb glbs/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --envpair 2,2 \
                    --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
                    --shot t=1.000,file=FAN_A.png
          ./fog_poc --glb glbs/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --envpair 2,2 \
                    --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
                    --shot t=1.0334,file=FAN_B.png
          python3 tools/tests/fan_anim_check.py shots/FAN_A.png shots/FAN_B.png 500

      - name: Animation regression check — the LIVE path actually ticks (v38)
        run: |
          # v38: the TRUE root-cause regression. The shot-path check above
          # passed for v33.13-v33.16 while RUN_SU0203.bat's interactive
          # window showed a FROZEN fan: every prior proof ran the
          # deterministic --shot fast-forward, which ticks the SH1X drivers
          # inline — the realtime loops (Win32/SDL/X11/benchmark) called
          # live_advance+render_frame WITHOUT any driver tick. This check
          # runs the BENCHMARK path (the same live_advance call sequence
          # as the window loops) with a FIXED camera at two --duration
          # values: pre-v38 = 0.00% pixels changed (completely static),
          # v38+ = ~10% (the fan + waterfall move). The --save-final
          # frame carries the live session's accumulated anim state.
          ./fog_poc --glb glbs/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --envpair 2,2 \
                    --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
                    --benchmark --duration 3 --save-final LIVE_A.png
          ./fog_poc --glb glbs/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --envpair 2,2 \
                    --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
                    --benchmark --duration 6 --save-final LIVE_B.png
          python3 tools/tests/fan_anim_check.py LIVE_A.png LIVE_B.png 500

      - name: Smoke test — engine renders a PNG headlessly
        run: |
          # --shot t=0 renders one deterministic frame (320x224) to
          # shots/shot_00000.00.png with no window: proves the release
          # binary actually runs, not just links.
          # (--shot REQUIRES a value: "t=SECONDS[,file=NAME.png]" —
          # a bare --shot exits with "unknown arg".)
          ./fog_poc --glb glbs/THRF9FD.glb --camdat input/camdat.json \
                    --input input --shot t=0
          test -s shots/shot_00000.00.png
          file shots/shot_00000.00.png
          # v28: the fan room smoke — night env pair {7,4} (the authentic
          # nightmare-school pair) with the flashlight on
          ./fog_poc --glb glbs/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --shot t=2.0,file=FAN_SMOKE.png
          test -s shots/FAN_SMOKE.png

      - name: Package one-click test zip (linux)
        if: needs.bump.outputs.did == '1' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          bash tools/package_release.sh "$TAG" dist ./fog_poc
          # prove the zip is REALLY one-click: unzip, run --test, check PNG
          mkdir -p /tmp/ziptest && cd /tmp/ziptest
          unzip -q "$GITHUB_WORKSPACE/dist/sh1x-poc-$TAG-linux.zip"
          ./RUN_THR.sh --test
          ./RUN_HP0003.sh --test
          ./RUN_SU0203.sh --test
          ./RUN_DRU0100.sh --test
          ./RUN_SPU0401.sh --test
          test -s shots/SELFTEST_THR.png
          test -s shots/SELFTEST_HP0003.png
          test -s shots/SELFTEST_SU0203.png
          test -s shots/SELFTEST_DRU0100.png
          test -s shots/SELFTEST_SPU0401.png
          echo "one-click zip verified: all five self-tests rendered"
          # v40: the SEWER water-animation regression (the DR_WAVE scroll +
          # glints MOVE: fixed camera, t=3 vs t=6 must differ — the water
          # tile advances + the glint pattern shimmers)
          # V44/V45 recalibration: the threshold was cut for the pre-V44
          # ADDITIVE water (which changed far more pixels per scroll step);
          # the engine-exact SUBTRACTIVE water (func_80059E34(1): ABR-2,
          # flat (56,56,56), bucket 640 — VLM-verified against the S20
          # reference images) moves ~122 DIFFERING PIXELS (~306 channel
          # diffs, mean per-pixel channel shift 8.4) over this 3s window
          # at this camera (the dapple scroll + the glint shimmer). The
          # check counts DIFFERING PIXELS against the threshold: 80 keeps
          # the frozen-water detector (0 px) with ~35% headroom.
          ./fog_poc --glb input/DRU0100.glb --camdat input/sewer_camdat.json \
              --input input --cam 56 1.8 -20 66 -1 -22 \
              --shot t=3.0,file=SEW_A.png
          ./fog_poc --glb input/DRU0100.glb --camdat input/sewer_camdat.json \
              --input input --cam 56 1.8 -20 66 -1 -22 \
              --shot t=6.0,file=SEW_B.png
          python3 "$GITHUB_WORKSPACE/tools/tests/fan_anim_check.py" shots/SEW_A.png shots/SEW_B.png 80
          # v40: the TV-animation regression (tvNoise paint: t=3 vs t=6)
          ./fog_poc --glb input/SPU0401.glb --camdat input/tv_camdat.json \
              --input input --cam 160 1.4 -56 164 0.6 -52 \
              --shot t=3.0,file=TV_A.png
          ./fog_poc --glb input/SPU0401.glb --camdat input/tv_camdat.json \
              --input input --cam 160 1.4 -56 164 0.6 -52 \
              --shot t=6.0,file=TV_B.png
          python3 "$GITHUB_WORKSPACE/tools/tests/fan_anim_check.py" shots/TV_A.png shots/TV_B.png 500
          # v28: the fan-animation regression proof runs from the UNZIPPED
          # one-click zip too (same fixed-camera one-tick pixel diff)
          ./fog_poc --glb input/SU0203.glb --camdat input/fan_camdat.json \
              --input input --envpair 2,2 \
              --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
              --shot t=1.000,file=FAN_A.png
          ./fog_poc --glb input/SU0203.glb --camdat input/fan_camdat.json \
              --input input --envpair 2,2 \
              --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
              --shot t=1.0334,file=FAN_B.png
          python3 "$GITHUB_WORKSPACE/tools/tests/fan_anim_check.py" shots/FAN_A.png shots/FAN_B.png 500

      - name: Upload release assets (bump or tag)
        if: needs.bump.outputs.did == '1' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # rel.tag is ALWAYS v-prefixed (v32.2 for bump pushes, the
          # pushed tag name for manual tags) — the zip names match the
          # classic tag-path naming exactly (sh1x-poc-vX.Y-*).
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.rel.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/sh1x-poc-${{ steps.rel.outputs.tag }}-linux.zip

  build-windows:
    needs: bump
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main carries the bump commit; tags build the tag; PRs build the PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || (startsWith(github.ref, 'refs/tags/') && github.ref) || github.ref }}

      - name: Resolve the release tag (bump or pushed tag)
        id: rel
        run: |
          if [ "${{ needs.bump.outputs.did }}" = "1" ]; then
            echo "tag=v${{ needs.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Zig (cross-compile, no mingw toolchain needed)
        run: |
          # Same command documented in Makefile.mingw option B.
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/zig-linux-x86_64-0.13.0:$PATH"
          zig version
          zig cc -target x86_64-windows-gnu -O2 -std=c99 \
            -o fog_poc.exe src/fog_poc.c -luser32 -lgdi32
          file fog_poc.exe

      - name: Package one-click test zip (windows)
        if: needs.bump.outputs.did == '1' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # the packaging script regenerates the GLBs with the repo converter
          # (numpy + Pillow needed for texture embedding)
          python3 -m pip install --user -q numpy pillow
          TAG="${{ steps.rel.outputs.tag }}"
          # NONE skips the linux binary/zip; only the -win zip is produced.
          bash tools/package_release.sh "$TAG" dist NONE ./fog_poc.exe
          unzip -l "dist/sh1x-poc-$TAG-win.zip"

      - name: Upload release assets (bump or tag)
        if: needs.bump.outputs.did == '1' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.rel.outputs.tag }}
          generate_release_notes: true
          files: dist/sh1x-poc-${{ steps.rel.outputs.tag }}-win.zip

      - name: Build source tarball (any release ref)
        if: needs.bump.outputs.did == '1' || startsWith(github.ref, 'refs/tags/v')
        run: |
          git archive --format=tar.gz -o "sh-poc-source.tar.gz" HEAD
          echo "TARBALL=sh-poc-source.tar.gz" >> "$GITHUB_ENV"

      - name: Attach source tarball
        if: needs.bump.outputs.did == '1' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.rel.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.TARBALL }}
