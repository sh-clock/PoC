name: poc-ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release (release assets are FREE, unlike artifacts)

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (make)
        run: make -C . all V=1

      - name: Convert sample scenes (GLBs are not committed)
        run: |
          # The converter needs numpy (TIM decode) + Pillow (PNG encode) for
          # texture embedding; the bare runner python3 has neither.
          python3 -m pip install --user -q numpy pillow
          # input/ tracks only the base rip files; regenerate the GLBs with
          # the converter at THIS commit so CI always exercises the
          # tools/ipd2gltf.py it ships.
          # NOTE: --output must NOT be the input dir — the converter always
          # excludes the output directory from texture scanning (writing
          # into input/ would drop every texture reference -> degraded GLB).
          # v28: SU0203 (nightmare-school FAN room) + SU0300 (corridor
          # reference) join the CI conversion set.
          python3 tools/ipd2gltf.py --input input --output glbs \
              --rooms THRF9FD,HP0003,SU0203,SU0300
          test -s glbs/THRF9FD.glb
          test -s glbs/HP0003.glb
          test -s glbs/SU0203.glb
          test -s glbs/SU0300.glb

      - name: Animation regression check — the fan actually ticks
        run: |
          # TWO deterministic stills one ENGINE TICK apart (1/30 s) with a
          # FIXED camera: with the camera frozen, any pixel change can only
          # come from the animated prop (the SU0203 FAN_HIDE spinRng driver,
          # verbatim map1_s02.c:1564-1591). Guards the whole chain: ripper
          # propAnims emission -> engine parse -> tick -> draw.
          ./fog_poc --glb glbs/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --envpair 2,2 \
                    --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
                    --shot t=1.000,file=FAN_A.png
          ./fog_poc --glb glbs/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --envpair 2,2 \
                    --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
                    --shot t=1.0334,file=FAN_B.png
          python3 tools/tests/fan_anim_check.py shots/FAN_A.png shots/FAN_B.png 500

      - name: Smoke test — engine renders a PNG headlessly
        run: |
          # --shot t=0 renders one deterministic frame (320x224) to
          # shots/shot_00000.00.png with no window: proves the release
          # binary actually runs, not just links.
          # (--shot REQUIRES a value: "t=SECONDS[,file=NAME.png]" —
          # a bare --shot exits with "unknown arg".)
          ./fog_poc --glb glbs/THRF9FD.glb --camdat input/camdat.json \
                    --input input --shot t=0
          test -s shots/shot_00000.00.png
          file shots/shot_00000.00.png
          # v28: the fan room smoke — night env pair {7,4} (the authentic
          # nightmare-school pair) with the flashlight on
          ./fog_poc --glb glbs/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --shot t=2.0,file=FAN_SMOKE.png
          test -s shots/FAN_SMOKE.png

      - name: Package one-click test zip (linux)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          bash tools/package_release.sh "$TAG" dist ./fog_poc
          # prove the zip is REALLY one-click: unzip, run --test, check PNG
          mkdir -p /tmp/ziptest && cd /tmp/ziptest
          unzip -q "$GITHUB_WORKSPACE/dist/sh1x-poc-$TAG-linux.zip"
          ./RUN_THR.sh --test
          ./RUN_HP0003.sh --test
          ./RUN_SU0203.sh --test
          test -s shots/SELFTEST_THR.png
          test -s shots/SELFTEST_HP0003.png
          test -s shots/SELFTEST_SU0203.png
          echo "one-click zip verified: all three self-tests rendered"
          # v28: the fan-animation regression proof runs from the UNZIPPED
          # one-click zip too (same fixed-camera one-tick pixel diff)
          ./fog_poc --glb input/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --envpair 2,2 \
                    --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
                    --shot t=1.000,file=FAN_A.png
          ./fog_poc --glb input/SU0203.glb --camdat input/fan_camdat.json \
                    --input input --envpair 2,2 \
                    --cam 98.5 1.0 -141.0 100.0 1.6 -144.07 55 \
                    --shot t=1.0334,file=FAN_B.png
          python3 "$GITHUB_WORKSPACE/tools/tests/fan_anim_check.py" shots/FAN_A.png shots/FAN_B.png 500

      - name: Upload release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sh1x-poc-${{ github.ref_name }}-linux.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Zig (cross-compile, no mingw toolchain needed)
        run: |
          # Same command documented in Makefile.mingw option B.
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/zig-linux-x86_64-0.13.0:$PATH"
          zig version
          zig cc -target x86_64-windows-gnu -O2 -std=c99 \
            -o fog_poc.exe src/fog_poc.c -luser32 -lgdi32
          file fog_poc.exe

      - name: Package one-click test zip (windows)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # the packaging script regenerates the GLBs with the repo converter
          # (numpy + Pillow needed for texture embedding)
          python3 -m pip install --user -q numpy pillow
          TAG="${GITHUB_REF_NAME}"
          # NONE skips the linux binary/zip; only the -win zip is produced.
          bash tools/package_release.sh "$TAG" dist NONE ./fog_poc.exe
          unzip -l "dist/sh1x-poc-$TAG-win.zip"

      - name: Upload release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/sh1x-poc-${{ github.ref_name }}-win.zip

      - name: Build source tarball (any ref)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git archive --format=tar.gz -o "sh-poc-source.tar.gz" HEAD
          # attach in the next step
          echo "TARBALL=sh-poc-source.tar.gz" >> "$GITHUB_ENV"

      - name: Attach source tarball
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.TARBALL }}
